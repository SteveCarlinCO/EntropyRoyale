<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000-Dot Entropy Royale: Final Two — Entropy Simulation</title>
<style>
  :root {
    --hatch-widget-bg: #14161a;
    --hatch-widget-surface: #1e2126;
    --hatch-widget-surface-muted: #191c20;
    --hatch-widget-text: #e8eaed;
    --hatch-widget-muted: #9aa0a6;
    --hatch-widget-border: #3c4043;
    --hatch-widget-accent: #e08a3c;
    --hatch-widget-on-accent: #14161a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--hatch-widget-bg);
    color: var(--hatch-widget-text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  
  .wrap { width: 100%; max-width: 760px; }
  .portal-canvas {
    width: 100%;
    height: 260px;
    display: block;
    border-radius: 22px;
    border: 1px solid rgba(0, 0, 0, 0.95);
    background:
      radial-gradient(circle 1.5px at 12% 22%, rgba(255, 255, 255, 0.9), transparent 70%),
      radial-gradient(circle 1px at 28% 68%, rgba(255, 255, 255, 0.7), transparent 70%),
      radial-gradient(circle 2px at 45% 15%, rgba(200, 220, 255, 0.8), transparent 70%),
      radial-gradient(circle 1px at 58% 82%, rgba(255, 255, 255, 0.6), transparent 70%),
      radial-gradient(circle 1.5px at 72% 38%, rgba(255, 255, 255, 0.85), transparent 70%),
      radial-gradient(circle 1px at 85% 62%, rgba(200, 220, 255, 0.7), transparent 70%),
      radial-gradient(circle 2px at 92% 18%, rgba(255, 255, 255, 0.75), transparent 70%),
      radial-gradient(circle 1px at 35% 45%, rgba(255, 255, 255, 0.5), transparent 70%),
      radial-gradient(circle 1.5px at 64% 12%, rgba(255, 255, 255, 0.65), transparent 70%),
      radial-gradient(circle 1px at 8% 78%, rgba(200, 220, 255, 0.6), transparent 70%),
      radial-gradient(circle 1px at 50% 55%, rgba(255, 255, 255, 0.55), transparent 70%),
      radial-gradient(circle 1.5px at 22% 88%, rgba(255, 255, 255, 0.7), transparent 70%),
      radial-gradient(ellipse 340px 150px at 28% 72%, rgba(112, 66, 200, 0.30), transparent 70%),
      radial-gradient(ellipse 300px 140px at 76% 28%, rgba(38, 110, 200, 0.27), transparent 70%),
      radial-gradient(ellipse 220px 220px at 55% 55%, rgba(20, 16, 40, 0.55), transparent 70%),
      radial-gradient(ellipse at 50% 45%, #10131a 0%, #000 60%, #010203 100%);
    background-repeat: no-repeat;
    box-shadow:
      0 0 0 8px #0a0c0f,
      0 0 0 9px #2b3038,
      0 0 0 15px #0a0c0f,
      0 0 0 16px var(--hatch-widget-border),
      0 24px 70px rgba(0, 0, 0, 0.8),
      inset 0 3px 0 rgba(255, 255, 255, 0.22),
      inset 0 -6px 18px rgba(0, 0, 0, 0.95),
      inset 0 0 95px rgba(0, 0, 0, 0.9),
      inset 0 0 160px rgba(96, 60, 200, 0.16);
    animation: portal-breathe 6s ease-in-out infinite alternate;
  }
  @keyframes portal-breathe {
    from {
      box-shadow:
        0 0 0 8px #0a0c0f,
        0 0 0 9px #2b3038,
        0 0 0 12px #0a0c0f,
        0 0 0 16px var(--hatch-widget-border),
        0 24px 70px rgba(0, 0, 5, 0.8),
        inset 0 3px 0 rgba(255, 255, 255, 0.16),
        inset 0 -6px 18px rgba(0, 0, 0, 0.95),
        inset 0 0 80px rgba(0, 0, 0, 0.88),
        inset 0 0 140px rgba(96, 60, 200, 0.10);
    }
    to {
      box-shadow:
        0 0 0 8px #0a0c0f,
        0 0 0 14px #2b3038,
        0 0 0 15px #0a0c0f,
        0 0 0 16px var(--hatch-widget-border),
        0 24px 70px rgba(0, 0, 0, 0.8),
        inset 0 3px 0 rgba(255, 255, 255, 0.28),
        inset 0 -6px 18px rgba(0, 0, 0, 0.95),
        inset 0 0 116px rgba(0, 0, 0, 0.94),
        inset 0 0 180px rgba(96, 60, 200, 0.22);
    }
  }
  /* Mini galaxy overlay, upper-right of the canvas */
  .canvas-holder { position: relative; }
  .canvas-holder .portal-canvas { position: relative; z-index: 1; background: transparent; }
  .mini-galaxy {
    position: absolute;
    top: 10px; right: 12px;
    width: 90px; height: 90px;
    z-index: 0;
    opacity: 0.8;
    pointer-events: none;
    perspective: 500px;
  }
  .mini-galaxy .tiny-galaxy {
    position: relative;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, #04050a 0%, #000 70%);
    transform: rotateX(75deg);
    -webkit-mask: radial-gradient(circle, #000 52%, transparent 78%);
    mask: radial-gradient(circle, #000 52%, transparent 78%);
  }
  .mini-galaxy .tg-stars {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle 1px at 22% 30%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1px at 68% 22%, rgba(200,220,255,0.85), transparent 70%),
      radial-gradient(circle 1px at 82% 58%, rgba(255,255,255,0.8), transparent 70%),
      radial-gradient(circle 1px at 58% 80%, rgba(255,255,255,0.75), transparent 70%),
      radial-gradient(circle 1px at 30% 72%, rgba(200,220,255,0.8), transparent 70%),
      radial-gradient(circle 1px at 12% 52%, rgba(255,255,255,0.7), transparent 70%),
      radial-gradient(circle 1px at 44% 44%, rgba(255,255,255,0.6), transparent 70%),
      radial-gradient(circle 1px at 74% 44%, rgba(255,255,255,0.6), transparent 70%);
    background-repeat: no-repeat;
    filter: blur(1.2px);
    animation: tg-twinkle 2.8s ease-in-out infinite alternate;
  }
  .mini-galaxy .tg-band {
    position: absolute; border-radius: 50%;
    filter: blur(10px);
    animation: tg-spin 70s linear infinite;
  }
  .mini-galaxy .tg-band.b1 { inset: 34%;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(160,190,255,0) 6deg, rgba(160,190,255,0.95) 18deg,
      rgba(160,190,255,0.95) 40deg, rgba(160,190,255,0) 52deg, transparent 64deg,
      transparent 180deg, rgba(160,190,255,0) 186deg, rgba(160,190,255,0.95) 198deg,
      rgba(160,190,255,0.95) 220deg, rgba(160,190,255,0) 232deg, transparent 244deg);
    -webkit-mask: radial-gradient(circle closest-side, #000 60%, transparent 78%);
    mask: radial-gradient(circle closest-side, #000 60%, transparent 78%);
  }
  .mini-galaxy .tg-band.b2 { inset: 22%;
    background: conic-gradient(from 45deg,
      transparent 0deg, rgba(160,190,255,0) 6deg, rgba(160,190,255,0.9) 18deg,
      rgba(170,170,255,0.9) 40deg, rgba(160,190,255,0) 52deg, transparent 64deg,
      transparent 180deg, rgba(160,190,255,0) 186deg, rgba(160,190,255,0.9) 198deg,
      rgba(170,170,255,0.9) 220deg, rgba(160,190,255,0) 232deg, transparent 244deg);
    -webkit-mask: radial-gradient(circle closest-side, transparent 52%, #000 66%, #000 88%, transparent 99%);
    mask: radial-gradient(circle closest-side, transparent 52%, #000 66%, #000 88%, transparent 99%);
  }
  .mini-galaxy .tg-band.b3 { inset: 8%;
    background: conic-gradient(from 90deg,
      transparent 0deg, rgba(150,170,255,0) 6deg, rgba(150,170,255,0.85) 18deg,
      rgba(190,160,255,0.85) 40deg, rgba(150,170,255,0) 52deg, transparent 64deg,
      transparent 180deg, rgba(150,170,255,0) 186deg, rgba(150,170,255,0.85) 198deg,
      rgba(190,160,255,0.85) 220deg, rgba(150,170,255,0) 232deg, transparent 244deg);
    -webkit-mask: radial-gradient(circle closest-side, transparent 60%, #000 72%, #000 92%, transparent 100%);
    mask: radial-gradient(circle closest-side, transparent 60%, #000 72%, #000 92%, transparent 100%);
  }
  .mini-galaxy .tg-halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, transparent 42%, rgba(120,140,255,0.14) 62%, transparent 78%);
  }
  .mini-galaxy .tg-core {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,253,244,1) 0%, rgba(255,228,180,0.75) 14%,
      rgba(255,196,140,0.3) 30%, transparent 52%);
    filter: blur(4px);
    animation: tg-pulse 4s ease-in-out infinite alternate;
  }
  @keyframes tg-spin { to { transform: rotate(360deg); } }
  @keyframes tg-twinkle { from { opacity: 0.6; } to { opacity: 1; } }
  @keyframes tg-pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
  /* Twinkling starfield behind the portal — three layers, desynced */
  .portal-stars {
    position: absolute; inset: 0; z-index: 0;
    pointer-events: none;
    background-repeat: no-repeat;
  }
  .portal-stars.s1 {
    background:
      radial-gradient(circle 1px at 5% 12%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1px at 14% 68%, rgba(255,255,255,0.8), transparent 70%),
      radial-gradient(circle 1px at 22% 34%, rgba(200,220,255,0.85), transparent 70%),
      radial-gradient(circle 1px at 31% 82%, rgba(255,255,255,0.75), transparent 70%),
      radial-gradient(circle 1px at 38% 18%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1px at 47% 55%, rgba(200,220,255,0.8), transparent 70%),
      radial-gradient(circle 1px at 55% 8%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(circle 1px at 63% 72%, rgba(255,255,255,0.75), transparent 70%),
      radial-gradient(circle 1px at 71% 28%, rgba(200,220,255,0.85), transparent 70%),
      radial-gradient(circle 1px at 79% 88%, rgba(255,255,255,0.8), transparent 70%),
      radial-gradient(circle 1px at 86% 44%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1px at 93% 15%, rgba(200,220,255,0.8), transparent 70%),
      radial-gradient(circle 1px at 9% 90%, rgba(255,255,255,0.75), transparent 70%),
      radial-gradient(circle 1px at 27% 52%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(circle 1px at 52% 38%, rgba(200,220,255,0.8), transparent 70%),
      radial-gradient(circle 1px at 68% 92%, rgba(255,255,255,0.75), transparent 70%),
      radial-gradient(circle 1px at 90% 70%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(circle 1px at 97% 36%, rgba(200,220,255,0.8), transparent 70%);
    animation: pstar-tw 2.4s ease-in-out infinite;
  }
  .portal-stars.s2 {
    background:
      radial-gradient(circle 1.5px at 8% 42%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1.5px at 19% 78%, rgba(200,220,255,0.85), transparent 70%),
      radial-gradient(circle 1.5px at 29% 16%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1.5px at 42% 64%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(circle 1.5px at 51% 28%, rgba(200,220,255,0.9), transparent 70%),
      radial-gradient(circle 1.5px at 60% 86%, rgba(255,255,255,0.8), transparent 70%),
      radial-gradient(circle 1.5px at 70% 8%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1.5px at 77% 52%, rgba(200,220,255,0.85), transparent 70%),
      radial-gradient(circle 1.5px at 88% 24%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1.5px at 95% 76%, rgba(255,255,255,0.8), transparent 70%),
      radial-gradient(circle 1.5px at 35% 48%, rgba(200,220,255,0.85), transparent 70%),
      radial-gradient(circle 1.5px at 58% 58%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(circle 1.5px at 12% 8%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 1.5px at 83% 90%, rgba(200,220,255,0.8), transparent 70%);
    animation: pstar-tw 3.7s ease-in-out -1.5s infinite;
  }
  .portal-stars.s3 {
    background:
      radial-gradient(circle 2px at 16% 28%, rgba(255,255,255,0.95), transparent 70%),
      radial-gradient(circle 2px at 36% 72%, rgba(200,220,255,0.9), transparent 70%),
      radial-gradient(circle 2px at 54% 16%, rgba(255,255,255,0.95), transparent 70%),
      radial-gradient(circle 2px at 66% 60%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 2px at 81% 36%, rgba(200,220,255,0.9), transparent 70%),
      radial-gradient(circle 2px at 92% 84%, rgba(255,255,255,0.95), transparent 70%),
      radial-gradient(circle 2px at 6% 62%, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(circle 2px at 48% 88%, rgba(200,220,255,0.9), transparent 70%),
      radial-gradient(circle 2px at 73% 12%, rgba(255,255,255,0.95), transparent 70%);
    animation: pstar-tw 5.5s ease-in-out -2.2s infinite;
  }
  @keyframes pstar-tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">
<div style="box-sizing:border-box;max-width:100%;padding:12px;">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
    <div style="font-weight:700;letter-spacing:.25em;font-size:13px;color:var(--hatch-widget-text);">1000-DOT ENTROPY ROYALE: FINAL TWO</div>
    <button id="reset" style="background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;">Reset</button>
  </div>
  <br>
  <div class="canvas-holder">
    <div class="portal-stars s1"></div>
    <div class="portal-stars s2"></div>
    <div class="portal-stars s3"></div>
    <div class="mini-galaxy">
      <div class="tiny-galaxy">
        <div class="tg-halo"></div>
        <div class="tg-stars"></div>
        <div class="tg-band b1"></div>
        <div class="tg-band b2"></div>
        <div class="tg-band b3"></div>
        <div class="tg-core"></div>
      </div>
    </div>
    <canvas id="cv10" class="portal-canvas"></canvas>
  </div>
<br>
  <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
    <label for="guessInput10" style="font-size:12px;color:var(--hatch-widget-text);white-space:nowrap;">Your pick (1&ndash;1000):</label>
    <input id="guessInput10" type="number" min="1" max="1000" placeholder="e.g. 437" style="width:90px;background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:6px 8px;font-size:12px;">
    <button id="guessBtn10" style="background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border:1px solid var(--hatch-widget-accent);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;">Lock in guess &amp; start</button>
  </div>
  <div id="status10" style="font-size:12px;color:var(--hatch-widget-muted);margin-top:8px;min-height:18px;">The dots are frozen. Lock in your guess to start the simulation.</div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
    <span style="font-size:11px;color:var(--hatch-widget-muted);white-space:nowrap;" id="dotsLabel10">dots: 1000</span>
    <div style="flex:1;height:8px;border-radius:4px;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);overflow:hidden;">
      <div id="meter10" style="height:100%;width:100%;background:var(--hatch-widget-accent);"></div>
    </div>
    <span style="font-size:11px;color:var(--hatch-widget-muted);white-space:nowrap;">2</span>
  </div>
</div>
</div>
<script>
(function(){
  var cv = document.getElementById('cv10');
  var ctx = cv.getContext('2d');
  var meter = document.getElementById('meter10');
  var dotsLabel = document.getElementById('dotsLabel10');
  var statusEl = document.getElementById('status10');
  var guessInput = document.getElementById('guessInput10');
  var guessBtn = document.getElementById('guessBtn10');
  var H = 260, W = 300, START = 1000, CELL = 14, FINAL = 2;
  var parts = [], debris = [], rings = [];
  var PALETTE = ['#4aa3ff','#ff6b4a','#ffd24a','#7de08a','#c58aff','#4adfd8'];
  var textColor = '#e8eaed', mutedColor = '#9aa0a6';
  var started = false, guess = null;
  var guessAlive = false, guessDeadAt = 0, verdictShown = false, guessingClosed = false;
  function resize(){
    var r = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    W = Math.max(60, r.width);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function reset(){
    parts = []; debris = []; rings = [];
    started = false; guess = null;
    verdictShown = false; guessingClosed = false;
    guessAlive = false; guessDeadAt = 0;
    var cols = Math.floor(W / 11), rows = Math.floor(H / 11);
    var cells = [];
    for (var cy = 0; cy < rows; cy++)
      for (var cx = 0; cx < cols; cx++)
        cells.push([cx, cy]);
    for (var i = cells.length - 1; i > 0; i--){
      var k = Math.floor(Math.random() * (i + 1));
      var tmp = cells[i]; cells[i] = cells[k]; cells[k] = tmp;
    }
    var n = Math.min(START, cells.length);
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = 0.8 + Math.random() * 1.4;
      parts.push({
        num: i + 1,
        x: cells[i][0] * 11 + 5.5 + (Math.random() - 0.5) * 4,
        y: cells[i][1] * 11 + 5.5 + (Math.random() - 0.5) * 4,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: 2.6 + Math.random() * 1.8,
        c: PALETTE[i % PALETTE.length]
      });
    }
    guessInput.disabled = false;
    guessBtn.disabled = false;
    guessInput.style.opacity = '1';
    guessBtn.style.opacity = '1';
    guessBtn.textContent = 'Lock in guess & start';
    updateStatus();
  }
  function detonate(x, y, color, big){
    var n = big ? 22 : 5;
    for (var i = 0; i < n && debris.length < 500; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = 1.2 + Math.random() * (big ? 4.5 : 2.6);
      debris.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 0.8 + Math.random() * 1.6,
        c: color, life: 1
      });
    }
    if (big || parts.length <= 12) rings.push({x: x, y: y, r: 3, life: 1, big: !!big});
  }
  function capSpeed(p, max){
    var s = Math.hypot(p.vx, p.vy);
    if (s > max){ p.vx = p.vx / s * max; p.vy = p.vy / s * max; }
  }
  function buildGrid(){
    var cols = Math.ceil(W / CELL);
    var rows = Math.ceil(H / CELL);
    var grid = new Array(cols * rows);
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      var cx = Math.max(0, Math.min(cols - 1, Math.floor(p.x / CELL)));
      var cy = Math.max(0, Math.min(rows - 1, Math.floor(p.y / CELL)));
      var k = cy * cols + cx;
      if (!grid[k]) grid[k] = [];
      grid[k].push(i);
    }
    return {grid: grid, cols: cols, rows: rows};
  }
  function updateStatus(){
    if (!started){
      statusEl.textContent = 'The dots are frozen. Lock in your guess to start the simulation.';
      return;
    }
    if (guess == null){
      statusEl.textContent = 'Simulation running.';
      return;
    }
    if (verdictShown) return;
    if (!guessAlive && guessDeadAt > 0){
      statusEl.textContent = 'Your pick #' + guess + ' was vaporized with ' + guessDeadAt + ' dots still standing.';
      return;
    }
    statusEl.textContent = 'Your pick: #' + guess + ' — still alive.' + (guessingClosed ? ' (guessing closed)' : ' (you can change it until 10 remain)');
  }
  function lockGuess(){
    var val = parseInt(guessInput.value, 10);
    if (isNaN(val) || val < 1 || val > START){
      statusEl.textContent = 'Pick a whole number between 1 and ' + START + '.';
      return;
    }
    var firstLock = !started;
    guess = val;
    started = true;
    guessAlive = parts.some(function(p){ return p.num === val; });
    if (firstLock){
      guessDeadAt = 0;
      guessBtn.textContent = 'Update guess';
    }
    updateStatus();
  }
  function frame(t){
    if (started){
      for (var i = 0; i < parts.length; i++){
        var p = parts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < p.r){ p.x = p.r; p.vx = Math.abs(p.vx); }
        if (p.x > W - p.r){ p.x = W - p.r; p.vx = -Math.abs(p.vx); }
        if (p.y < p.r){ p.y = p.r; p.vy = Math.abs(p.vy); }
        if (p.y > H - p.r){ p.y = H - p.r; p.vy = -Math.abs(p.vy); }
      }
      if (parts.length > FINAL && parts.length <= 8){
        for (var i = 0; i < parts.length; i++){
          var p = parts[i], best = null, bd = 1e9;
          for (var j = 0; j < parts.length; j++){
            if (i === j) continue;
            var q = parts[j];
            var d = (q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y);
            if (d < bd){ bd = d; best = q; }
          }
          if (best){
            var dlen = Math.sqrt(bd) || 1;
            p.vx += (best.x - p.x) / dlen * 0.07;
            p.vy += (best.y - p.y) / dlen * 0.07;
            capSpeed(p, 3.4);
          }
        }
      }
      var di = -1, dj = -1;
      if (parts.length > FINAL){
        var G = buildGrid(), grid = G.grid, gcols = G.cols, grows = G.rows;
        outer:
        for (var i = 0; i < parts.length; i++){
          var a = parts[i];
          var ccx = Math.max(0, Math.min(gcols - 1, Math.floor(a.x / CELL)));
          var ccy = Math.max(0, Math.min(grows - 1, Math.floor(a.y / CELL)));
          for (var oy = -1; oy <= 1; oy++){
            for (var ox = -1; ox <= 1; ox++){
              var nx = ccx + ox, ny = ccy + oy;
              if (nx < 0 || ny < 0 || nx >= gcols || ny >= grows) continue;
              var cell = grid[ny * gcols + nx];
              if (!cell) continue;
              for (var c = 0; c < cell.length; c++){
                var j = cell[c];
                if (j <= i) continue;
                var b = parts[j];
                var dx = b.x - a.x, dy = b.y - a.y;
                var rr = a.r + b.r;
                if (dx * dx + dy * dy < rr * rr){ di = i; dj = j; break outer; }
              }
            }
          }
        }
      } else if (parts.length === FINAL){
        var a = parts[0], b = parts[1];
        var dx = b.x - a.x, dy = b.y - a.y;
        var rr = a.r + b.r;
        var d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 0.01){
          var d = Math.sqrt(d2);
          var nx = dx / d, ny = dy / d;
          var push = (rr - d) / 2;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
          var tx = a.vx; a.vx = b.vx; b.vx = tx;
          var ty = a.vy; a.vy = b.vy; b.vy = ty;
        }
      }
      if (di >= 0){
        var a = parts[di], b = parts[dj];
        detonate(a.x, a.y, a.c, false);
        detonate(b.x, b.y, b.c, false);
        var dead = {};
        dead[di] = true; dead[dj] = true;
        if (parts.length <= 12) rings.push({x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, r: 4, life: 1, big: false});
        parts = parts.filter(function(p, k){ return !dead[k]; });
        if (guess != null && guessAlive){
          guessAlive = parts.some(function(p){ return p.num === guess; });
          if (!guessAlive){ guessDeadAt = parts.length; updateStatus(); }
        }
      }
      if (!guessingClosed && parts.length <= 10 && parts.length > FINAL){
        guessingClosed = true;
        guessInput.disabled = true;
        guessBtn.disabled = true;
        guessInput.style.opacity = '0.5';
        guessBtn.style.opacity = '0.5';
        updateStatus();
      }
      for (var i = debris.length - 1; i >= 0; i--){
        var d = debris[i];
        d.x += d.vx; d.y += d.vy;
        d.vx *= 0.985; d.vy *= 0.985;
        d.life -= 0.014;
        if (d.life <= 0) debris.splice(i, 1);
      }
      for (var i = rings.length - 1; i >= 0; i--){
        var g = rings[i];
        g.r += g.big ? 3.2 : 2.2;
        g.life -= g.big ? 0.03 : 0.05;
        if (g.life <= 0) rings.splice(i, 1);
      }
    }
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < debris.length; i++){
      var d = debris[i];
      ctx.globalAlpha = Math.max(0, d.life) * 0.85;
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * d.life + 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (var i = 0; i < rings.length; i++){
      var g = rings[i];
      ctx.globalAlpha = Math.max(0, g.life) * 0.7;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = g.big ? 3 : 2;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    var done = started && parts.length === FINAL;
    var showNums = started && parts.length <= 40 && parts.length > FINAL;
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      if (done){
        var pulse = 1 + 0.18 * Math.sin(t / 280 + i * 2);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(10, p.r * 2.2) * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, done ? Math.max(9, p.r) : p.r, 0, Math.PI * 2);
      ctx.fill();
      if (showNums || done){
        ctx.font = done ? '700 10px system-ui, sans-serif' : '700 8px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(0,0,0,0.75)';
        var label = String(p.num);
        ctx.strokeText(label, p.x, p.y + 0.5);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(label, p.x, p.y + 0.5);
      }
    }
    if (!started){
      ctx.fillStyle = mutedColor;
      ctx.globalAlpha = 0.9;
      ctx.font = '700 14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PLACE YOUR GUESS TO BEGIN', W / 2, H / 2);
      ctx.globalAlpha = 1;
    }
    if (done){
      var s1 = parts[0].num, s2 = parts[1].num;
      ctx.fillStyle = textColor;
      ctx.globalAlpha = 0.9;
      ctx.font = '700 15px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('DOTS #' + s1 + ' AND #' + s2 + ' SURVIVE', W / 2, 30);
      ctx.globalAlpha = 1;
      if (!verdictShown){
        verdictShown = true;
        if (guess == null){
          statusEl.textContent = 'Dots #' + s1 + ' and #' + s2 + ' walk out of the rubble.';
        } else if (guess === s1 || guess === s2){
          statusEl.textContent = 'NAILED IT. Your pick #' + guess + ' survived — one of the final two. Take a bow.';
        } else {
          statusEl.textContent = 'Dots #' + s1 + ' and #' + s2 + ' survive. Your pick #' + guess + ' is debris. Better luck next reset.';
        }
      }
    }
    var frac = (parts.length - FINAL) / (START - FINAL);
    meter.style.width = Math.max(0, frac * 100).toFixed(1) + '%';
    dotsLabel.textContent = 'dots: ' + parts.length;
    requestAnimationFrame(frame);
  }
  guessBtn.addEventListener('click', lockGuess);
  guessInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') lockGuess();
  });
  document.getElementById('reset').addEventListener('click', reset);
  resize();
  reset();
  if (window.ResizeObserver){ new ResizeObserver(function(){ resize(); }).observe(cv); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
